[project]
name = "training-ai-agents"
version = "0.1.0"
description = "AI Agents Training — notebooks and demos for LLM agents with LangChain & LangGraph (local models via Ollama)"
readme = "README.md"
requires-python = ">=3.11"
# Single source of truth for dependencies. Install with `uv sync`; add with `uv add <pkg>`.
dependencies = [
    "research-agent",
    "ipykernel",
    "jupyterlab",
    "python-dotenv",
    "ipython",
    "pydantic",
    "requests",
    "typing-extensions",
    "openai>1.50.0",
    "langchain>=1.3.0",
    "langchain-core",
    "langgraph>=0.3.1",
    "langgraph-sdk",
    "langchain-anthropic>=0.1.23",
    "langchain-fireworks>=0.1.7",
    "langchainhub",
    "langchain-openai",
    "langchain-community",
    "langchain-chroma>=0.1.2",
    "langchain-ollama",
    "langchain-mcp-adapters>=0.2.0",
    "tavily-python>=0.5.0",
    "langchain-tavily>=0.1.0",
    "langchain-nomic",
    "nomic[local]",
    "faiss-cpu",
    "tiktoken",
    "pypdf",
    "chroma",
    "chromadb",
    "google-search-results",
    "numexpr",
    "beautifulsoup4",
    "scikit-learn",
    "langgraph-cli[inmem]",
    "langgraph-checkpoint-sqlite",
    "langsmith",
    "ollama",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false  # root is a course workspace, not an installable package

[tool.uv.workspace]
members = ["demos/research_agent"]

[tool.uv.sources]
research-agent = { workspace = true }
